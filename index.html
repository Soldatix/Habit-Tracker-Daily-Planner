<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Habit Tracker / Daily Planner by Apps & Games — build habits, plan daily tasks, track streaks and progress, and keep your data privately in your browser." />
    <meta name="keywords" content="habit tracker, daily planner, habit planner, task planner, streak tracker, productivity app, free online planner" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://habit-tracker.appsandgames.org/" />

    <meta property="og:title" content="Habit Tracker / Daily Planner | Apps & Games" />
    <meta property="og:description" content="Build habits, plan daily tasks, track streaks and progress, and keep your data privately in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://habit-tracker.appsandgames.org/" />
    <meta property="og:site_name" content="Apps & Games" />
    <meta property="og:image" content="https://habit-tracker.appsandgames.org/habit-tracker-cover.png" />
    <meta property="og:image:alt" content="Habit Tracker / Daily Planner app preview" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Habit Tracker / Daily Planner | Apps & Games" />
    <meta name="twitter:description" content="Build habits, plan daily tasks and track streaks in a free multilingual browser app." />
    <meta name="twitter:image" content="https://habit-tracker.appsandgames.org/habit-tracker-cover.png" />

    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/habit-adsterra.css" />
    <link rel="stylesheet" href="https://appsandgames.org/privacy-choice.css" />
    <script defer src="https://appsandgames.org/privacy-choice.js"></script>
    <title>Habit Tracker / Daily Planner | Apps & Games</title>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Habit Tracker / Daily Planner",
      "url": "https://habit-tracker.appsandgames.org/",
      "image": "https://habit-tracker.appsandgames.org/habit-tracker-cover.png",
      "description": "A free multilingual browser app for building habits, planning daily tasks, tracking streaks and progress, and keeping data locally in the browser.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Any",
      "isAccessibleForFree": true,
      "inLanguage": ["en", "hr", "de", "it", "es"],
      "publisher": {
        "@type": "Organization",
        "name": "Apps & Games",
        "url": "https://appsandgames.org/"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!-- Parser-time original Adsterra GET CODE, placed below the entire
         planner and its dynamic footer. Never inside the rerendered #app. -->
    <section id="habit-ad-area" aria-label="Advertisement" hidden>
      <div class="habit-ad-unit" data-size="728x90" hidden>
        <script src="/habit-adsterra-loader.js" data-unit="desktop"></script>
      </div>
      <div class="habit-ad-unit" data-size="320x50" hidden>
        <script src="/habit-adsterra-loader.js" data-unit="mobile"></script>
      </div>
    </section>
    <div class="footer-links habit-privacy-footer" aria-label="Privacy choices"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
